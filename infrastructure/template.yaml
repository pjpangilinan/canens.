AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Canens - an AI proxy and a whole-store snapshot backup.

  The browser is the source of truth. This stack exists because Bedrock
  credentials cannot live in a browser bundle, and because a copy of the data
  is worth having somewhere other than the user's browser profile.

  There is no database, and deliberately no VPC. The snapshot is one object in
  S3 and the daily model-call counter is one item in DynamoDB, both of which are
  AWS services the function can reach directly with a public IP. A VPC would
  have been needed only to reach a database inside it, and a Lambda in a VPC
  cannot reach the internet at all without a NAT gateway (about $33/month) or a
  private endpoint (about $7/month). With neither, this stack costs about
  $0.02/month.

Parameters:
  FrontendOrigin:
    Type: String
    Default: https://pjpangilinan.github.io
    Description: >
      Where the site is served from, without a trailing slash. Cognito redirects
      back here after sign-in, so this has to be the deployed site and nothing
      else. AllowedOrigins below must include it.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://pjpangilinan.github.io
    Description: >
      Origins allowed to call the API. A real list, not one string with commas
      in it: API Gateway matches AllowOrigins by exact string, so a single
      element of "a,b" matches neither a nor b, and the preflight comes back
      with no Access-Control-Allow-Origin at all.
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model used for goal breakdown and starter goals.
  AlertEmail:
    Type: String
    Description: Address notified when the stack nears its monthly budget.

Globals:
  Function:
    # No Runtime: Lambda rejects it on a function with PackageType Image, and
    # the base image is decided by backend/Dockerfile anyway.
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Resources:

  # -------------------------------------------------------------- the store

  # One object per user, overwritten on every upload. There are no queries to
  # run and no rows to join, so an object store is the whole requirement and a
  # relational engine would be paying for features nothing here uses.
  #
  # Retained on delete: this is the user's only copy of their data outside the
  # browser, so `sam delete` must not take it with it.
  SnapshotBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "canens-snapshots-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Disables ACLs entirely, so the object ownership rules cannot be loosened
      # later by someone adding a grant.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          # Already a list, so it is used directly rather than wrapped in
          # another one.
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [GET, PUT]
            AllowedHeaders: [Content-Type]
            MaxAge: 3000

  # One item per user per day, holding how many model calls have been made, and
  # removed by TTL. It is here rather than in memory because Lambda discards
  # execution environments: a counter in a process resets to zero whenever the
  # container is replaced, which looks like a working ceiling and is not one.
  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "canens-ai-usage-${AWS::AccountId}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires
        Enabled: true

  # ------------------------------------------------------------------- auth

  # Sign-up is open. The daily model-call allowance starts small and ramps over
  # the first few days, so an account created to try the app cannot cost
  # anything meaningful, which is a better place to spend the constraint than
  # gating registration.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: canens-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 2
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false

  # A public client: no secret, because the browser cannot keep one. The
  # authorization code flow with PKCE is what makes that safe, and it is why
  # there is no client secret to configure or leak.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: canens-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # Must be true or AllowedOAuthFlows, CallbackURLs, LogoutURLs and the
      # scopes are all ignored and only SDK sign-in is permitted - which would
      # leave the hosted UI unreachable with no error anywhere.
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub "${FrontendOrigin}/"
        - http://localhost:3000/
      LogoutURLs:
        - !Sub "${FrontendOrigin}/"
        - http://localhost:3000/
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        # Username and password, for anything that is not a browser: the
        # screenshot walkthrough needs a token, and there is no way to drive a
        # hosted-UI redirect from a script. The browser itself uses the `code`
        # flow above and never touches this.
        - ALLOW_USER_PASSWORD_AUTH
      # Do not reveal whether an account exists, so the sign-in form cannot be
      # used to enumerate who has signed up.
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      # Said out loud, because the default unit for an access token is hours and
      # for a refresh token days, and the two numbers below only make sense with
      # the units attached. Cognito rejects the pair outright as an invalid
      # range otherwise.
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1

  # Validates the signature, issuer, expiry and audience before the function is
  # invoked at all, and hands the function the verified claims. The function
  # therefore does no cryptography: it reads the subject out of the event.
  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      Name: canens-cognito
      ApiId: !Ref CanensApi
      # The HTTP API spelling is JWT here, and JwtConfiguration rather than
      # JWTConfiguration. Both are required: without ApiId the authorizer is not
      # attached to the API, and API Gateway then rejects the route.
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

  # ------------------------------------------------------------------- api

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}'
      RetentionInDays: 14

  # Written out as explicit API Gateway resources rather than
  # AWS::Serverless::HttpApi. The implicit form builds a default stage whose
  # dependencies CloudFormation reports as a cycle against the function's own
  # HttpApi events, and the stage is also where throttling has to live.
  CanensApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: canens-prod
      ProtocolType: HTTP
      Description: Canens API

  # CORS is the application's, not API Gateway's. A preflight is an OPTIONS, it
  # matches the greedy route below, and the JWT authorizer runs before any
  # automatic CORS response - so a browser asking permission to send a bearer
  # token gets a 401 and the request never leaves. Preflight therefore gets its
  # own unauthenticated routes, and CORSMiddleware in main.py answers. One
  # owner for the policy, and it is testable without deploying.
  ProxyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CanensApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      # 2.0 is what Mangum reads. With 1.0 the stage name is prepended to the
      # path and FastAPI never matches a route.
      PayloadFormatVersion: "2.0"
      IntegrationUri: !GetAtt CanensFunction.Arn

  # Health is deliberately the one unauthenticated route, so an uptime check
  # needs no token and cannot be turned into a way to spend money. It returns
  # nothing but a word. An explicit path beats the greedy route below, so
  # GET /api/health lands here rather than being authenticated.
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CanensApi
      RouteKey: "GET /api/health"
      AuthorizationType: NONE
      Target: !Sub "integrations/${ProxyIntegration}"

  PreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CanensApi
      RouteKey: "OPTIONS /{proxy+}"
      AuthorizationType: NONE
      Target: !Sub "integrations/${ProxyIntegration}"

  PreflightRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CanensApi
      RouteKey: "OPTIONS /"
      AuthorizationType: NONE
      Target: !Sub "integrations/${ProxyIntegration}"

  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CanensApi
      RouteKey: "ANY /"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub "integrations/${ProxyIntegration}"

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CanensApi
      # The greedy route covers the AI and snapshot routes, and both need a
      # valid token.
      RouteKey: "ANY /{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub "integrations/${ProxyIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn:
      - RootRoute
      - ProxyRoute
    Properties:
      ApiId: !Ref CanensApi
      # $default, so there is no stage segment in the URL. A named stage is
      # prepended to the path the function receives, and the greedy route then
      # hands Mangum "/prod/api/health" and every request 404s in FastAPI.
      StageName: "$default"
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","stage":"$context.stage","path":"$context.path","routeKey":"$context.routeKey","status":"$context.status"}
      # Keys are the route keys, not "*": API Gateway rejects a wildcard here
      # with "Unable to find Route by key *".
      RouteSettings:
        "ANY /":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        "ANY /{proxy+}":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CanensFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CanensApi}/*/*"

  # --------------------------------------------------------------- function

  CanensFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../backend
    Properties:
      PackageType: Image
      Description: Canens API - AI proxy and snapshot backup
      # No VpcConfig, deliberately. Nothing here is inside a VPC, so the
      # function has a public IP and reaches S3, DynamoDB and Bedrock directly.
      #
      # No ReservedConcurrentExecutions either: this account's Lambda concurrency
      # quota is 10, and reserving any of it drops the unreserved pool below the
      # floor AWS enforces. Request rate is bounded by the API Gateway throttle
      # above and Bedrock spend by the daily cap, so concurrency is not what the
      # budget depends on.
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          # The application splits this on commas, so it needs a string rather
          # than the list the parameter holds.
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          SNAPSHOT_BUCKET: !Ref SnapshotBucket
          USAGE_TABLE: !Ref UsageTable
          # No AWS_REGION: Lambda treats it as a reserved key and rejects the
          # whole update. The runtime already knows its own region.
      Policies:
        - Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
            - Sid: Logs
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
            - Sid: Snapshot
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              # Only the snapshots prefix, and only this bucket. The list is a
              # grant, not a condition, so the role cannot be used to list or
              # delete anything.
              Resource: !Sub "${SnapshotBucket.Arn}/snapshots/*"
            - Sid: SnapshotPrefixListing
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt SnapshotBucket.Arn
              # Without this, S3 answers a GetObject for a key that does not
              # exist with 403 AccessDenied instead of 404 NoSuchKey, to avoid
              # revealing whether an object exists to a caller that cannot list.
              # The application needs to tell "never backed up" apart from
              # "no permission", and without this grant it cannot. Scoped to the
              # one prefix the function already has full read access to.
              Condition:
                StringLike:
                  "s3:prefix": "snapshots/*"
            - Sid: UsageCounter
              Effect: Allow
              Action:
                # UpdateItem is the conditional increment. GetItem and PutItem
                # are the account record that dates the user's first call, which
                # is what the daily allowance is ramped against. Leaving either
                # off fails only on a request that reaches the model, with an
                # opaque ClientError.
                - dynamodb:UpdateItem
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt UsageTable.Arn

  # ------------------------------------------------------- cost and alarms

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: canens-monthly
        BudgetLimit:
          Amount: 5
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: canens-lambda-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref CanensFunction

Outputs:
  ApiEndpoint:
    Description: Base URL of the Canens API
    Value: !Sub 'https://${CanensApi}.execute-api.${AWS::Region}.amazonaws.com'
  SnapshotBucketName:
    Description: S3 bucket holding the whole-store snapshot
    Value: !Ref SnapshotBucket
  UsageTableName:
    Description: DynamoDB table holding the daily model-call counter
    Value: !Ref UsageTable
  UserPoolId:
    Description: NEXT_PUBLIC_COGNITO_USER_POOL_ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: NEXT_PUBLIC_COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
  # The three NEXT_PUBLIC_* values the frontend build needs, in one string, so
  # they can be pasted into the repository's Actions variables without anyone
  # having to read this template:
  #   aws cloudformation describe-stacks --stack-name canens-prod \
  #     --query 'Stacks[0].Outputs[?OutputKey==`FrontendVariables`].OutputValue'
  FrontendVariables:
    Description: The API URL, pool id and client id the frontend build needs
    Value: !Sub >-
      NEXT_PUBLIC_API_URL=https://${CanensApi}.execute-api.${AWS::Region}.amazonaws.com
      NEXT_PUBLIC_COGNITO_USER_POOL_ID=${UserPool}
      NEXT_PUBLIC_COGNITO_CLIENT_ID=${UserPoolClient}
      NEXT_PUBLIC_AWS_REGION=${AWS::Region}
