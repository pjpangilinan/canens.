AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Canens - an AI proxy and a whole-store snapshot backup.

  The browser is the source of truth. This stack exists because Bedrock
  credentials cannot live in a browser bundle, and because a copy of the data
  is worth having somewhere other than the user's browser profile.

  Network layout is deliberate: public subnets only, no NAT Gateway. A Lambda
  in a private subnet needs a NAT Gateway to reach Bedrock, which costs about
  $32/month before any traffic. A Lambda in a public subnet gets a public IP
  and reaches the internet through the IGW directly. The database shares those
  subnets but its security group accepts connections only from the Lambda's
  security group, so it is not reachable from the internet in any useful way.

Parameters:
  DatabaseName:
    Type: String
    Default: canens
    Description: Name of the Postgres database to create.
  DatabaseUsername:
    Type: String
    Default: canens
    Description: Master username for the database.
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Master password. Stored in SSM at /canens/prod/database-password.
  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: >
      Shared secret the API requires in the X-Canens-Token header. This is not
      real authentication - it ships in the public frontend bundle. It exists to
      slow down casual abuse of a public endpoint, alongside the daily call cap.
  AllowedOrigins:
    Type: String
    Default: https://pjpangilinan.github.io
    Description: Comma-separated origins allowed to call the API.
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model used for goal breakdown and starter goals.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Resources:

  # ---------------------------------------------------------------- network

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: canens-prod

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: canens-prod

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: canens-prod-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: canens-prod-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: canens-prod

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ----------------------------------------------------------- security

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Canens Lambda egress
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS, for Bedrock
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
          Description: Postgres, inside the VPC

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Canens RDS ingress
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Postgres, from the Lambda only

  # -------------------------------------------------------------- database

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Canens
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: canens/prod/database
      Description: Canens Postgres master credentials
      SecretString: !Sub >-
        {"username": "${DatabaseUsername}", "password": "${DatabasePassword}"}

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: canens-prod
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '16.4'
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Ref DatabasePassword
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      PubliclyAccessible: true
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      EnablePerformanceInsights: false
      Tags:
        - Key: Name
          Value: canens-prod

  # --------------------------------------------------------------- function

  CanensFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Description: Canens API - AI proxy and snapshot backup
      Metadata:
        Dockerfile: Dockerfile
        DockerContext: ../backend
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          DATABASE_URL: !Sub >-
            postgresql+asyncpg://${DatabaseUsername}:${DatabasePassword}@${Database.Endpoint.Address}:5432/${DatabaseName}
          API_TOKEN: !Ref ApiToken
          APP_ENV: production
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          AWS_REGION: !Ref AWS::Region
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
            - Sid: Logs
              Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'

  # ------------------------------------------------------------------- api

  CanensApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Description: Canens API
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Canens-Token
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  CanensFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CanensFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CanensApi}/*/*'

  # ------------------------------------------------------- cost and alarms

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: canens-monthly
        BudgetLimit:
          Amount: 25
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  AlertEmail:
    Type: String
    Description: Email address for the monthly budget alarm.

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: canens-lambda-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref CanensFunction

  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: canens-database-storage
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000000000
      ComparisonOperator: LessThanOrEqualToThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database

Outputs:
  ApiEndpoint:
    Description: Base URL of the Canens API
    Value: !Sub 'https://${CanensApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  DatabaseEndpoint:
    Description: Hostname of the Postgres instance
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: Secrets Manager ARN holding the database credentials
    Value: !Ref DatabaseSecret
