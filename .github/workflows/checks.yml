name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canens
          POSTGRES_PASSWORD: canens_dev_pass
          POSTGRES_DB: canens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U canens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Test
        # Real Postgres, not SQLite. now() does not exist in SQLite, which is
        # how an unevaluated SQL expression went uncaught for so long.
        env:
          DATABASE_URL: postgresql+asyncpg://canens:canens_dev_pass@localhost:5432/canens_test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
        run: npm run build
