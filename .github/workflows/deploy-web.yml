name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Fail if the build variables are not configured
        # The build itself succeeds without them, because a missing value is a
        # deployment mistake rather than a compile error. Catching it here stops
        # a page shipping that points at localhost, or that has no way to sign
        # in and therefore 401s on every call.
        #
        # Written out one at a time on purpose: GitHub interpolates ${{ }} before
        # the shell runs, so a loop over variable names cannot look up vars.$name.
        run: |
          missing=0
          for pair in \
            "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}" \
            "NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}" \
            "NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}" \
            "NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH }}"
          do
            if [ -z "${pair#*=}" ]; then
              echo "::error::Repository variable ${pair%%=*} is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "The values are published by the stack:"
            echo "  aws cloudformation describe-stacks --stack-name canens-prod \\"
            echo "    --query 'Stacks[0].Outputs[?OutputKey==\`FrontendVariables\`].OutputValue' --output text"
            echo "and NEXT_PUBLIC_BASE_PATH is the repository name, slash included."
            exit 1
          fi

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint, typecheck and test
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_AWS_REGION: ${{ vars.NEXT_PUBLIC_AWS_REGION }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
