services:
  # There is no database. The snapshot is an object in S3 and the daily
  # model-call counter is an item in DynamoDB, both reached with the credentials
  # in your AWS profile, exactly as Bedrock is.
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      SNAPSHOT_BUCKET: canens-snapshots
      USAGE_TABLE: canens-ai-usage
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
